<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>그릿마인드랩 컨설팅예약 관리자페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --paper:#FAF7F1;
    --ink:#22262B;
    --rule:#D9D2C0;
    --accent:#B4552F;
    --accent-soft:#F0E3D3;
    --complete:#5B7A5E;
    --muted:#8A8577;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard', sans-serif;
    min-height:100vh;
  }
  /* ---- 잠금 화면 ---- */
  #lock-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
  }
  #lock-screen h1{
    font-family:'Song Myung', serif;
    font-weight:400;
    font-size:28px;
    margin-bottom:20px;
  }
  #lock-screen input{
    font-size:16px;
    padding:10px 2px;
    border:none;
    border-bottom:1px solid var(--rule);
    background:transparent;
    width:220px;
    text-align:center;
    margin-bottom:16px;
    outline:none;
  }
  #lock-screen input:focus{ border-bottom:1px solid var(--accent); }
  #lock-error{ color:var(--accent); font-size:13px; margin-bottom:12px; display:none; }

  /* ---- 대시보드 ---- */
  #dashboard{ display:none; max-width:920px; margin:0 auto; padding:40px 24px 80px; }
  header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:28px; }
  header h1{
    font-family:'Song Myung', serif;
    font-weight:400;
    font-size:28px;
    margin:0;
  }
  header .summary{ font-size:13px; color:var(--muted); }

  nav{ display:flex; gap:22px; border-bottom:1px solid var(--rule); margin-bottom:28px; }
  nav button{
    background:none; border:none; cursor:pointer;
    font-family:inherit; font-size:14px; color:var(--muted);
    padding:10px 0; border-bottom:2px solid transparent;
  }
  nav button.active{ color:var(--ink); border-bottom:2px solid var(--accent); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th, td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--rule); }
  th{ color:var(--muted); font-weight:500; font-size:13px; }
  td.status-done{ color:var(--complete); }
  td.status-open{ color:var(--muted); }

  .btn{ font-family:inherit; font-size:13px; cursor:pointer; border:none; padding:6px 12px; }
  .btn-accent{ background:var(--accent); color:#fff; }
  .btn-line{ background:transparent; border:1px solid var(--rule); color:var(--muted); }
  .btn-danger{ background:transparent; border:1px solid var(--accent); color:var(--accent); }

  .form-row{ display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:end; }
  .form-field{ display:flex; flex-direction:column; gap:6px; }
  .form-field label{ font-size:12px; color:var(--muted); }
  .form-field input, .form-field select, .form-field textarea{
    font-family:inherit; font-size:14px; padding:8px; border:1px solid var(--rule); background:#fff;
  }
  textarea{ width:100%; min-height:140px; resize:vertical; }

  .empty{ font-size:14px; color:var(--muted); padding:16px 0; }
  #feedback-saved-msg{ font-size:13px; color:var(--complete); display:none; margin-top:8px; }

  .table-scroll{ overflow-x:auto; }
  .import-box{
    border:1px solid var(--rule);
    background:#fff;
    padding:16px;
    margin-bottom:24px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .import-box .desc{ font-size:12px; color:var(--muted); flex:1 1 260px; }
  .divider-label{
    font-size:12px; color:var(--muted); text-align:center;
    margin:20px 0; position:relative;
  }
  .divider-label::before, .divider-label::after{
    content:''; display:inline-block; width:36%; height:1px;
    background:var(--rule); vertical-align:middle; margin:0 8px;
  }
  #import-result{ font-size:13px; margin-top:10px; display:none; }
  #import-result.ok{ color:var(--complete); }
  #import-result.err{ color:var(--accent); }
  td.small-note{ font-size:12px; color:var(--muted); }
</style>
</head>
<body>

<!-- 잠금 화면 -->
<div id="lock-screen">
  <h1>그릿마인드랩 컨설팅예약 관리자페이지</h1>
  <input type="password" id="password-input" placeholder="비밀번호">
  <p id="lock-error">비밀번호가 올바르지 않습니다.</p>
  <button class="btn btn-accent" id="unlock-btn">입장</button>
</div>

<!-- 대시보드 -->
<div id="dashboard">
  <header>
    <h1>그릿마인드랩 컨설팅예약 관리자페이지</h1>
    <span class="summary" id="summary-text"></span>
  </header>

  <div class="form-row" style="margin-bottom:14px;">
    <div class="form-field" style="min-width:220px;">
      <label for="school-selector">학교 선택</label>
      <select id="school-selector"></select>
    </div>
  </div>

  <nav>
    <button class="tab-btn active" data-panel="panel-status">예약 현황</button>
    <button class="tab-btn" data-panel="panel-slots">시간대 관리</button>
    <button class="tab-btn" data-panel="panel-participants">명단 관리</button>
    <button class="tab-btn" data-panel="panel-feedback">피드백 작성</button>
    <button class="tab-btn" data-panel="panel-schools">학교 관리</button>
  </nav>

  <!-- 예약 현황 -->
  <div class="panel active" id="panel-status">
    <div style="text-align:right; margin-bottom:14px;">
      <button class="btn btn-line" id="export-status-btn">엑셀로 다운로드</button>
    </div>
    <table>
      <thead>
        <tr><th>날짜</th><th>시간</th><th>방식</th><th>예약자</th><th>전화번호</th><th>상태</th><th></th></tr>
      </thead>
      <tbody id="status-table-body"></tbody>
    </table>
  </div>

  <!-- 시간대 관리 -->
  <div class="panel" id="panel-slots">
    <div class="form-row">
      <div class="form-field">
        <label for="slot-date">날짜</label>
        <input type="date" id="slot-date">
      </div>
      <div class="form-field">
        <label for="slot-time">시간</label>
        <select id="slot-time"></select>
      </div>
      <div class="form-field">
        <label for="slot-mode">방식</label>
        <select id="slot-mode">
          <option value="대면">대면</option>
          <option value="비대면">비대면</option>
        </select>
      </div>
      <button class="btn btn-accent" id="add-slot-btn">시간대 추가</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>날짜</th><th>시간</th><th>방식</th><th>상태</th><th>예약자 배정</th><th></th></tr></thead>
        <tbody id="slots-table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- 명단 관리 -->
  <div class="panel" id="panel-participants">

    <div class="import-box">
      <span class="desc">어떤 양식의 엑셀이든 올릴 수 있어요. 올리면 컬럼을 자동으로 읽어서, 이름·전화번호가 어느 컬럼인지만 확인해주시면 나머지 컬럼은 있는 그대로 저장됩니다.</span>
      <input type="file" id="excel-file-input" accept=".xlsx,.xls">
    </div>

    <div id="mapping-box" style="display:none;">
      <div class="form-row">
        <div class="form-field">
          <label for="map-name-select">이름 컬럼</label>
          <select id="map-name-select"></select>
        </div>
        <div class="form-field">
          <label for="map-phone-select">전화번호 컬럼</label>
          <select id="map-phone-select"></select>
        </div>
        <button class="btn btn-accent" id="import-excel-btn">이 매칭으로 등록</button>
      </div>
      <p class="empty" id="mapping-preview" style="margin-top:-8px;"></p>
    </div>
    <p id="import-result"></p>

    <div class="divider-label">한 명씩 직접 추가</div>

    <div class="form-row">
      <div class="form-field">
        <label for="p-name">이름</label>
        <input type="text" id="p-name" placeholder="예: 김서연">
      </div>
      <div class="form-field">
        <label for="p-phone">전화번호</label>
        <input type="tel" id="p-phone" placeholder="예: 010-1234-5678">
      </div>
      <div class="form-field">
        <label for="p-note">비고 (선택)</label>
        <input type="text" id="p-note" placeholder="예: 경영학과 · 삼성전자 희망">
      </div>
      <button class="btn btn-accent" id="add-participant-btn">명단에 추가</button>
    </div>

    <div class="table-scroll">
      <table>
        <thead><tr><th>이름</th><th>전화번호</th><th>추가정보</th><th></th></tr></thead>
        <tbody id="participants-table-body"></tbody>
      </table>
    </div>

  </div>

  <!-- 피드백 작성 -->
  <div class="panel" id="panel-feedback">
    <div class="form-row">
      <div class="form-field" style="min-width:220px;">
        <label for="fb-select">참가자 선택</label>
        <select id="fb-select"></select>
      </div>
    </div>
    <textarea id="fb-content" placeholder="상담 피드백을 입력하세요."></textarea>
    <div style="margin-top:12px;">
      <button class="btn btn-accent" id="save-feedback-btn">저장하기</button>
      <span id="feedback-saved-msg">저장되었습니다.</span>
    </div>
  </div>

  <!-- 학교 관리 -->
  <div class="panel" id="panel-schools">
    <div class="form-row">
      <div class="form-field">
        <label for="school-name-input">학교(또는 프로그램) 이름</label>
        <input type="text" id="school-name-input" placeholder="예: 국민대학교">
      </div>
      <button class="btn btn-accent" id="add-school-btn">학교 추가</button>
    </div>
    <p class="empty" style="margin-top:-8px;">새 학교를 추가하면, 참가자 페이지의 학교 선택 화면에 바로 나타납니다.</p>
    <table>
      <thead><tr><th>학교명</th><th></th></tr></thead>
      <tbody id="schools-table-body"></tbody>
    </table>
  </div>
</div>

<!-- 엑셀 읽기 -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentSchoolId = null;

function schoolCol(name){
  return db.collection('schools').doc(currentSchoolId).collection(name);
}

// ---------- 잠금 화면 ----------
function unlock(){
  const pw = document.getElementById('password-input').value;
  if(pw === ADMIN_PASSWORD){
    sessionStorage.setItem('admin_authed', '1');
    showDashboard();
  } else {
    document.getElementById('lock-error').style.display = 'block';
  }
}
document.getElementById('unlock-btn').addEventListener('click', unlock);
document.getElementById('password-input').addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });

async function showDashboard(){
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  await refreshSchoolSelector();
  loadAll();
}

if(sessionStorage.getItem('admin_authed') === '1'){
  showDashboard();
}

// ---------- 학교 선택 ----------
async function refreshSchoolSelector(){
  const selector = document.getElementById('school-selector');
  const snap = await db.collection('schools').orderBy('name').get();
  selector.innerHTML = '';

  if(snap.empty){
    selector.innerHTML = '<option value="">등록된 학교 없음</option>';
    currentSchoolId = null;
    return;
  }

  const savedId = sessionStorage.getItem('admin_selected_school');
  let matched = false;
  snap.forEach(doc => {
    const opt = document.createElement('option');
    opt.value = doc.id;
    opt.textContent = doc.data().name;
    if(doc.id === savedId){ opt.selected = true; matched = true; }
    selector.appendChild(opt);
  });
  if(!matched){ selector.selectedIndex = 0; }
  currentSchoolId = selector.value;
  sessionStorage.setItem('admin_selected_school', currentSchoolId);
}

document.getElementById('school-selector').addEventListener('change', (e) => {
  currentSchoolId = e.target.value;
  sessionStorage.setItem('admin_selected_school', currentSchoolId);
  loadAll();
});

// ---------- 탭 전환 ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.panel).classList.add('active');
  });
});

// ---------- 공통 ----------
function normalizePhone(v){ return (v || '').replace(/[^0-9]/g, ''); }

function formatDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const weekday = ['일','월','화','수','목','금','토'][d.getDay()];
  const [y, m, day] = dateStr.split('-');
  return `${parseInt(m)}월 ${parseInt(day)}일(${weekday})`;
}

async function loadAll(){
  await renderSchools();
  if(!currentSchoolId){
    document.getElementById('status-table-body').innerHTML = '<tr><td colspan="7" class="empty">먼저 "학교 관리" 탭에서 학교를 추가해주세요.</td></tr>';
    document.getElementById('slots-table-body').innerHTML = '';
    document.getElementById('participants-table-body').innerHTML = '';
    document.getElementById('fb-select').innerHTML = '';
    document.getElementById('summary-text').textContent = '';
    return;
  }
  await Promise.all([renderStatus(), renderSlots(), renderParticipants(), renderFeedbackSelect()]);
}

// ---------- 예약 현황 ----------
async function renderStatus(){
  const tbody = document.getElementById('status-table-body');
  const snap = await schoolCol('slots').orderBy('date').orderBy('time').get();
  tbody.innerHTML = '';
  let doneCount = 0;
  snap.forEach(doc => {
    const d = doc.data();
    const reserved = !!d.reservedBy;
    if(reserved) doneCount++;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${formatDate(d.date)}</td>
      <td>${d.time}</td>
      <td>${d.mode || '-'}</td>
      <td>${reserved ? d.reservedBy.name : '-'}</td>
      <td>${reserved ? d.reservedBy.phone : '-'}</td>
      <td class="${reserved ? 'status-done' : 'status-open'}">${reserved ? '예약완료' : '공석'}</td>
      <td>${reserved ? `<button class="btn btn-line" onclick="adminCancelSlot('${doc.id}')">예약취소</button>` : ''}</td>
    `;
    tbody.appendChild(tr);
  });
  const participantsSnap = await schoolCol('participants').get();
  document.getElementById('summary-text').textContent =
    `등록 인원 ${participantsSnap.size}명 · 예약 완료 ${doneCount}건`;
}

window.adminCancelSlot = async function(slotId){
  if(!confirm('이 예약을 취소할까요?')) return;
  await schoolCol('slots').doc(slotId).update({
    reservedBy: firebase.firestore.FieldValue.delete(),
    reservedAt: firebase.firestore.FieldValue.delete()
  });
  loadAll();
};

// ---------- 예약 현황 엑셀 다운로드 ----------
document.getElementById('export-status-btn').addEventListener('click', async () => {
  if(!currentSchoolId){ alert('먼저 학교를 선택해주세요.'); return; }
  const snap = await schoolCol('slots').orderBy('date').orderBy('time').get();
  const rows = [];
  snap.forEach(doc => {
    const d = doc.data();
    const reserved = !!d.reservedBy;
    rows.push({
      '날짜': formatDate(d.date),
      '시간': d.time,
      '방식': d.mode || '',
      '예약자': reserved ? d.reservedBy.name : '',
      '전화번호': reserved ? d.reservedBy.phone : '',
      '상태': reserved ? '예약완료' : '공석'
    });
  });

  if(rows.length === 0){
    alert('등록된 시간대가 없습니다.');
    return;
  }

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{ wch: 14 }, { wch: 8 }, { wch: 8 }, { wch: 12 }, { wch: 15 }, { wch: 10 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '예약현황');

  const today = new Date();
  const stamp = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  XLSX.writeFile(wb, `예약현황_${stamp}.xlsx`);
});

// ---------- 시간대 관리 ----------
// 30분 단위 시간 옵션 생성 (00:00 ~ 23:30)
(function populateTimeOptions(){
  const select = document.getElementById('slot-time');
  for(let h = 0; h < 24; h++){
    for(let m of [0, 30]){
      const hh = String(h).padStart(2, '0');
      const mm = String(m).padStart(2, '0');
      const opt = document.createElement('option');
      opt.value = `${hh}:${mm}`;
      opt.textContent = `${hh}:${mm}`;
      select.appendChild(opt);
    }
  }
})();

document.getElementById('add-slot-btn').addEventListener('click', async () => {
  if(!currentSchoolId){ alert('먼저 학교를 선택해주세요.'); return; }
  const date = document.getElementById('slot-date').value;
  const time = document.getElementById('slot-time').value;
  const mode = document.getElementById('slot-mode').value;
  if(!date || !time){ alert('날짜와 시간을 모두 입력해주세요.'); return; }
  await schoolCol('slots').add({ date, time, mode, reservedBy: null });
  document.getElementById('slot-date').value = '';
  loadAll();
});

let participantsCache = [];

async function renderSlots(){
  const tbody = document.getElementById('slots-table-body');
  const snap = await schoolCol('slots').orderBy('date').orderBy('time').get();

  const pSnap = await schoolCol('participants').orderBy('name').get();
  participantsCache = [];
  pSnap.forEach(doc => participantsCache.push(doc.data()));

  tbody.innerHTML = '';
  if(snap.empty){
    tbody.innerHTML = '<tr><td colspan="6" class="empty">등록된 시간대가 없습니다.</td></tr>';
    return;
  }
  snap.forEach(doc => {
    const d = doc.data();
    const reserved = !!d.reservedBy;
    const tr = document.createElement('tr');

    const options = participantsCache.map(p =>
      `<option value="${p.phone}" ${reserved && d.reservedBy.phone === p.phone ? 'selected' : ''}>${p.name} (${p.phone})</option>`
    ).join('');

    tr.innerHTML = `
      <td>${formatDate(d.date)}</td>
      <td>${d.time}</td>
      <td>${d.mode || '-'}</td>
      <td class="${reserved ? 'status-done' : 'status-open'}">${reserved ? '예약됨 (' + d.reservedBy.name + ')' : '공석'}</td>
      <td>
        <div style="display:flex; gap:6px; align-items:center;">
          <select style="font-family:inherit; font-size:13px; padding:6px; border:1px solid var(--rule);" id="assign-select-${doc.id}">
            <option value="">참가자 선택</option>
            ${options}
          </select>
          <button class="btn btn-line" onclick="assignSlot('${doc.id}')">${reserved ? '변경' : '배정'}</button>
        </div>
      </td>
      <td><button class="btn btn-danger" onclick="deleteSlot('${doc.id}')">삭제</button></td>
    `;
    tbody.appendChild(tr);
  });
}

window.assignSlot = async function(slotId){
  const select = document.getElementById(`assign-select-${slotId}`);
  const phone = select.value;
  if(!phone){ alert('참가자를 선택해주세요.'); return; }
  const participant = participantsCache.find(p => p.phone === phone);
  if(!participant){ alert('참가자 정보를 찾을 수 없습니다.'); return; }

  try{
    // 이 참가자가 이미 다른 시간에 예약이 있는지 확인
    const allSlots = await schoolCol('slots').get();
    let existingSlotId = null;
    allSlots.forEach(d => {
      const dd = d.data();
      if(dd.reservedBy && dd.reservedBy.phone === phone && d.id !== slotId){
        existingSlotId = d.id;
      }
    });

    if(existingSlotId){
      const ok = confirm('이 참가자는 이미 다른 시간에 예약이 있습니다. 기존 예약을 취소하고 이 시간으로 옮길까요?');
      if(!ok) return;
      await schoolCol('slots').doc(existingSlotId).update({
        reservedBy: firebase.firestore.FieldValue.delete(),
        reservedAt: firebase.firestore.FieldValue.delete()
      });
    }

    await schoolCol('slots').doc(slotId).update({
      reservedBy: { name: participant.name, phone: participant.phone },
      reservedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    loadAll();
  }catch(e){
    alert('배정 중 오류가 발생했습니다: ' + e.message);
  }
};

function formatExtra(d){
  // 기존(국민대) 방식의 개별 필드들도 함께 표시 (하위 호환)
  const legacyPairs = [
    ['전공', d.major], ['학년/상태', d.yearStatus], ['학번', d.studentId],
    ['이메일', d.email], ['운영방식', d.mode],
    ['구분', d.teamType], ['팀명', d.teamName],
    ['희망기업', d.company], ['희망직무', d.job], ['확인사항', d.note]
  ].filter(([, v]) => v);

  const extraPairs = d.extra ? Object.entries(d.extra).filter(([, v]) => v) : [];

  return [...legacyPairs, ...extraPairs].map(([k, v]) => `${k}: ${v}`).join(' · ');
}

// ---------- 명단 관리: 엑셀 파일 선택 시 컬럼 자동 감지 ----------
let parsedRows = null;

const NAME_SYNONYMS = ['이름', '성명', 'name'];
const PHONE_SYNONYMS = ['연락처', '전화번호', '휴대폰', '휴대폰번호', '핸드폰', '핸드폰번호', 'phone', 'tel', '전화'];

function guessColumn(headers, synonyms){
  const found = headers.find(h => synonyms.includes(String(h).trim().toLowerCase()));
  return found || '';
}

document.getElementById('excel-file-input').addEventListener('change', async () => {
  const fileInput = document.getElementById('excel-file-input');
  const mappingBox = document.getElementById('mapping-box');
  const resultEl = document.getElementById('import-result');
  resultEl.style.display = 'none';
  mappingBox.style.display = 'none';
  parsedRows = null;

  const file = fileInput.files[0];
  if(!file) return;

  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, { type: 'array' });

    // 시트가 여러 개면, 행이 가장 많은(=요약 시트가 아닌) 시트를 선택
    let bestRows = [];
    for(const sheetName of wb.SheetNames){
      const json = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
      if(json.length > bestRows.length) bestRows = json;
    }

    if(bestRows.length === 0){
      resultEl.textContent = '엑셀에서 데이터를 찾지 못했습니다. 파일을 확인해주세요.';
      resultEl.className = 'err';
      resultEl.style.display = 'block';
      return;
    }

    parsedRows = bestRows;
    const headers = Object.keys(bestRows[0]);

    const nameSelect = document.getElementById('map-name-select');
    const phoneSelect = document.getElementById('map-phone-select');
    nameSelect.innerHTML = headers.map(h => `<option value="${h}">${h}</option>`).join('');
    phoneSelect.innerHTML = headers.map(h => `<option value="${h}">${h}</option>`).join('');

    const guessedName = guessColumn(headers, NAME_SYNONYMS);
    const guessedPhone = guessColumn(headers, PHONE_SYNONYMS);
    if(guessedName) nameSelect.value = guessedName;
    if(guessedPhone) phoneSelect.value = guessedPhone;

    document.getElementById('mapping-preview').textContent =
      `감지된 컬럼: ${headers.join(', ')} (총 ${bestRows.length}행)`;

    mappingBox.style.display = 'block';
  }catch(e){
    resultEl.textContent = '엑셀을 읽는 중 오류가 발생했습니다: ' + e.message;
    resultEl.className = 'err';
    resultEl.style.display = 'block';
  }
});

// ---------- 명단 관리: 선택한 매칭으로 등록 ----------
document.getElementById('import-excel-btn').addEventListener('click', async () => {
  if(!currentSchoolId){ alert('먼저 학교를 선택해주세요.'); return; }
  const resultEl = document.getElementById('import-result');
  resultEl.style.display = 'none';

  if(!parsedRows){ alert('엑셀 파일을 먼저 선택해주세요.'); return; }

  const nameCol = document.getElementById('map-name-select').value;
  const phoneCol = document.getElementById('map-phone-select').value;
  if(!nameCol || !phoneCol){ alert('이름과 전화번호 컬럼을 선택해주세요.'); return; }

  try{
    const batch = db.batch();
    let count = 0;
    let skipped = 0;

    parsedRows.forEach(row => {
      const name = String(row[nameCol] || '').trim();
      const phone = normalizePhone(row[phoneCol]);
      if(!name || !phone){ skipped++; return; }

      const extra = {};
      Object.keys(row).forEach(header => {
        if(header === nameCol || header === phoneCol) return;
        const value = String(row[header] === undefined || row[header] === null ? '' : row[header]).trim();
        if(value) extra[header] = value;
      });

      const docData = { name, phone };
      if(Object.keys(extra).length > 0) docData.extra = extra;

      batch.set(schoolCol('participants').doc(phone), docData, { merge: true });
      count++;
    });

    if(count === 0){
      resultEl.textContent = '등록할 수 있는 행이 없습니다 (선택한 이름/전화번호 컬럼에 값이 있는지 확인해주세요).';
      resultEl.className = 'err';
      resultEl.style.display = 'block';
      return;
    }

    await batch.commit();
    resultEl.textContent = `${count}명 등록 완료${skipped > 0 ? ` (이름 또는 전화번호가 없어 ${skipped}건 제외)` : ''}`;
    resultEl.className = 'ok';
    resultEl.style.display = 'block';
    document.getElementById('excel-file-input').value = '';
    document.getElementById('mapping-box').style.display = 'none';
    parsedRows = null;
    loadAll();
  }catch(e){
    resultEl.textContent = '등록 중 오류가 발생했습니다: ' + e.message;
    resultEl.className = 'err';
    resultEl.style.display = 'block';
  }
});

async function renderFeedbackSelect(){
  const select = document.getElementById('fb-select');
  const snap = await schoolCol('participants').orderBy('name').get();
  select.innerHTML = '';
  snap.forEach(doc => {
    const d = doc.data();
    const opt = document.createElement('option');
    opt.value = d.phone;
    opt.textContent = `${d.name} (${d.phone})`;
    select.appendChild(opt);
  });
  if(!select.value && select.options.length > 0){
    select.selectedIndex = 0;
  }
  if(select.options.length > 0) loadFeedbackContent(select.value);
}

document.getElementById('fb-select').addEventListener('change', (e) => {
  loadFeedbackContent(e.target.value);
});

async function loadFeedbackContent(phone){
  if(!phone) return;
  const doc = await schoolCol('feedback').doc(phone).get();
  document.getElementById('fb-content').value = doc.exists ? (doc.data().content || '') : '';
}

document.getElementById('save-feedback-btn').addEventListener('click', async () => {
  if(!currentSchoolId){ alert('먼저 학교를 선택해주세요.'); return; }
  const select = document.getElementById('fb-select');
  const phone = select.value;
  if(!phone) return;
  const name = select.options[select.selectedIndex].textContent.split(' (')[0];
  const content = document.getElementById('fb-content').value;
  await schoolCol('feedback').doc(phone).set({
    name, phone, content, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  const msg = document.getElementById('feedback-saved-msg');
  msg.style.display = 'inline';
  setTimeout(() => { msg.style.display = 'none'; }, 2000);
});

window.deleteSchool = async function(schoolId){
  if(!confirm('이 학교를 삭제할까요? 해당 학교의 참가자 명단·시간대·피드백이 모두 함께 삭제되며 되돌릴 수 없습니다.')) return;

  const subcollections = ['participants', 'slots', 'feedback'];
  for(const name of subcollections){
    const snap = await db.collection('schools').doc(schoolId).collection(name).get();
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    if(!snap.empty) await batch.commit();
  }
  await db.collection('schools').doc(schoolId).delete();

  if(currentSchoolId === schoolId){
    sessionStorage.removeItem('admin_selected_school');
    currentSchoolId = null;
  }
  await refreshSchoolSelector();
  loadAll();
};
